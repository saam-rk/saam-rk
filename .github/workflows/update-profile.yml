name: Update profile

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "profile.json"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: read

concurrency:
  group: profile-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'saam-rk/saam-rk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Render offline and test generators
        run: |
          python -m scripts.generate
          python -m unittest discover -s tests -v
      - name: Refresh public data and render SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.generate --refresh
      - name: Validate refreshed assets
        run: |
          python -m unittest discover -s tests -v
          python -m scripts.generate
      - name: Commit only changed generated files
        run: |
          git add -- assets/*.svg data/profile.json
          if git diff --cached --quiet; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh public profile assets"
          git push origin HEAD:main
